[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stockwire-rental-backend"
version = "0.6.0"
description = "Stockwire Rental backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.161.1",
  "uvicorn[standard]==0.54.0",
  "email-validator==2.3.0",
  "jinja2==3.1.6",
  "pydantic-settings==2.16.1",
  "pywebpush==2.5.0",
  "sqlalchemy==2.1.6",
  "asyncpg==0.32.0",
  "psycopg[binary]==3.3.6",
  "alembic==1.20.1",
  "redis==8.1.0",
  "structlog==26.1.0",
  "PyJWT[crypto]==2.15.1",
  "passlib[bcrypt]==1.7.4",
  "python3-saml==1.16.0",
  "python-multipart==0.0.32",
  "httpx==0.28.1",
  "paho-mqtt==2.1.0",
  "boto3==1.43.118",
  "prometheus-fastapi-instrumentator==8.1.0",
  "icalendar==7.3.0",
  "openai>=3.37.0,<3.38.0",
  "slowapi>=0.1.9",
  "reportlab>=5,<5.2",
  "pypdf>=6.21,<6.22",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "httpx==0.28.1",
  "ruff==0.17.2"
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Alembic migration files expose revision metadata as module-level constants
# that Alembic reads via introspection; they are intentionally "unused" in
# the Python sense, so do not flag them.
per-file-ignores = { "alembic/versions/*.py" = ["F841"] }
