[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stockwire-rental-backend"
version = "0.1.0"
description = "Stockwire Rental backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.115.12",
  "uvicorn[standard]==0.34.2",
  "email-validator==2.2.0",
  "pydantic-settings==2.9.1",
  "sqlalchemy==2.0.40",
  "asyncpg==0.30.0",
  "psycopg[binary]==3.2.7",
  "alembic==1.15.2",
  "redis==5.2.1",
  "structlog==25.3.0",
  "python-jose[cryptography]==3.3.0",
  "passlib[bcrypt]==1.7.4",
  "python3-saml==1.16.0",
  "python-multipart==0.0.9",
  "boto3==1.38.23"
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.5",
  "pytest-asyncio==0.26.0",
  "httpx==0.28.1",
  "ruff==0.11.8"
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.setuptools]
packages = ["app"]
[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"
