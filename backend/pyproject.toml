[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stockwire-rental-backend"
version = "0.6.0"
description = "Stockwire Rental backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.141.1",
  "uvicorn[standard]==0.52.2",
  "email-validator==2.3.0",
  "jinja2==3.1.6",
  "pydantic-settings==2.15.0",
  "pywebpush==2.4.0",
  "sqlalchemy==2.0.52",
  "asyncpg==0.31.0",
  "psycopg[binary]==3.3.4",
  "alembic==1.19.1",
  "redis==8.1.0",
  "structlog==26.1.0",
  "python-jose[cryptography]==3.5.0",
  "passlib[bcrypt]==1.7.4",
  "python3-saml==1.16.0",
  "python-multipart==0.0.32",
  "httpx==0.28.1",
  "paho-mqtt==2.1.0",
  "boto3==1.43.71",
  "prometheus-fastapi-instrumentator==8.1.0",
  "icalendar==7.2.2",
  "openai>=3.0.0,<3.1.0",
  "slowapi>=0.1.9",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "httpx==0.28.1",
  "ruff==0.16.2"
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"
