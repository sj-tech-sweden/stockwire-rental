<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f3f9f3" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#182228" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Stockwire" />
    <script>
      ;(() => {
        let storedLocale = ''
        try {
          storedLocale = localStorage.getItem('sw_locale') || localStorage.getItem('sw_company_default_language') || ''
        } catch {
          storedLocale = ''
        }
        const browserLocale = navigator.language || navigator.languages?.[0] || ''
        const locale = String(storedLocale || browserLocale || 'en').trim().toLowerCase()
        document.documentElement.lang = locale === 'sv' || locale.startsWith('sv-') ? 'sv' : 'en'
      })()
    </script>

    <title>Stockwire Rental</title>
