name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  pull-requests: write

jobs:
  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci
      - name: Run frontend unit tests
        working-directory: frontend
        run: npm run test:smoke

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Install backend deps
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install .[dev]
      - name: Run backend tests
        working-directory: backend
        run: pytest -q

  e2e-tests:
    runs-on: ubuntu-latest
    needs: [frontend-tests, backend-tests]
    strategy:
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install frontend deps and Playwright
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps

      - name: Start services with docker-compose
        env:
          APP_ENV: test
        run: |
          docker compose -f infra/compose/docker-compose.dev.yml up -d --build

      - name: Wait for backend to be ready
        run: |
          for i in {1..30}; do
            if curl --fail --silent --show-error http://localhost:8000/ >/dev/null; then
              break
            fi
            echo "waiting..."; sleep 2
          done
          curl --fail --silent --show-error http://localhost:8000/ >/dev/null || exit 1

      - name: Wait for frontend to be ready
        run: |
          for i in {1..60}; do
            if curl --fail --silent --show-error http://localhost:9000/ >/dev/null; then
              break
            fi
            echo "waiting for frontend..."; sleep 5
          done
          curl --fail --silent --show-error http://localhost:9000/ >/dev/null || exit 1

      - name: Run Playwright E2E for ${{ matrix.browser }}
        working-directory: frontend
        env:
          BROWSER: ${{ matrix.browser }}
        run: |
          npx playwright test --project=${{ matrix.browser }} --trace=on

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-artifacts-${{ matrix.browser }}
          path: |
            frontend/test-results
            frontend/playwright-report
            frontend/tests/e2e/artifacts

  pr-screenshots:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    needs: [e2e-tests]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install frontend deps and Playwright
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps

      - name: Start services with docker-compose
        env:
          APP_ENV: test
        run: |
          docker compose -f infra/compose/docker-compose.dev.yml up -d --build

      - name: Wait for backend to be ready
        run: |
          for i in {1..30}; do
            if curl --fail --silent --show-error http://localhost:8000/ >/dev/null; then
              break
            fi
            echo "waiting..."; sleep 2
          done
          curl --fail --silent --show-error http://localhost:8000/ >/dev/null || exit 1

      - name: Wait for frontend to be ready
        run: |
          for i in {1..60}; do
            if curl --fail --silent --show-error http://localhost:9000/ >/dev/null; then
              break
            fi
            echo "waiting for frontend..."; sleep 5
          done
          curl --fail --silent --show-error http://localhost:9000/ >/dev/null || exit 1

      - name: Capture screenshots
        working-directory: frontend
        run: npx playwright test tests/e2e/screenshots.spec.ts --project=chromium

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pr-screenshots
          path: frontend/tests/e2e/artifacts/screenshots

      - name: Post screenshots to PR
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          DIR="frontend/tests/e2e/artifacts/screenshots"
          if [ ! -d "$DIR" ]; then echo "No screenshots found"; exit 0; fi
          mapfile -t FILES < <(find "$DIR" -maxdepth 1 -name '*.png' -printf '%f\n' | sort)
          if [ ${#FILES[@]} -eq 0 ]; then echo "No screenshot files found"; exit 0; fi

          BODY="## 📸 PR Screenshots"$'\n'
          BODY+=$'\n'"Automated screenshots of key pages captured from this PR:"$'\n'
          for f in "${FILES[@]}"; do
            name="${f%.png}"
            BODY+=$'\n'"- **${name}**: see artifact [\`${f}\`](../artifacts/pr-screenshots)"
          done
          BODY+=$'\n'$'\n'"Download the full screenshots from the **pr-screenshots** artifact above."

          EXISTING=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
            --jq '.[] | select(.user.type=="Bot" and (.body | contains("## 📸 PR Screenshots"))) | .id' | head -n1)
          if [ -n "$EXISTING" ]; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${EXISTING}" -f "body=${BODY}"
          else
            gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" -f "body=${BODY}"
          fi
