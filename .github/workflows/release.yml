name: Release

on:
  pull_request:
    branches: [main]
    types: [closed]
  workflow_dispatch:
    inputs:
      release_type:
        description: 'release type (major, minor, patch)'
        required: true
        default: 'patch'

jobs:
  create-release:
    if: >
      ${{
        github.event_name == 'workflow_dispatch' ||
        (
          github.event.pull_request.merged == true &&
          (
            contains(github.event.pull_request.labels.*.name, 'major') ||
            contains(github.event.pull_request.labels.*.name, 'minor') ||
            contains(github.event.pull_request.labels.*.name, 'patch')
          )
        )
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.semver.outputs.tag }}
      release_sha: ${{ steps.commit_versions.outputs.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.merge_commit_sha || github.sha }}

      - name: Determine release type
        id: rtype
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            LABEL=${{ toJSON(github.event.pull_request.labels) }}
            # Highest precedence wins: major > minor > patch
            if echo "$LABEL" | grep -q '"name":"major"'; then
              echo "type=major" >> "$GITHUB_OUTPUT"
            elif echo "$LABEL" | grep -q '"name":"minor"'; then
              echo "type=minor" >> "$GITHUB_OUTPUT"
            elif echo "$LABEL" | grep -q '"name":"patch"'; then
              echo "type=patch" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "type=${{ github.event.inputs.release_type }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Compute next semver tag
        id: semver
        run: |
          git fetch --tags
          LATEST=$(git describe --tags --abbrev=0 2>/dev/null || echo "0.0.0")
          echo "Latest tag: $LATEST"
          IFS='.' read -r MAJ MIN PAT <<<"$LATEST"
          TYPE=${{ steps.rtype.outputs.type }}
          if [ "$TYPE" = "major" ]; then MAJ=$((MAJ+1)); MIN=0; PAT=0; fi
          if [ "$TYPE" = "minor" ]; then MIN=$((MIN+1)); PAT=0; fi
          if [ "$TYPE" = "patch" ]; then PAT=$((PAT+1)); fi
          NEW_TAG="$MAJ.$MIN.$PAT"
          echo "New tag: $NEW_TAG"
          echo "tag=$NEW_TAG" >> $GITHUB_OUTPUT

      - name: Generate changelog
        id: changelog
        run: |
          git fetch --tags
          LATEST=$(git describe --tags --abbrev=0 2>/dev/null || echo "0.0.0")
          NEW_TAG=${{ steps.semver.outputs.tag }}
          if [ "$LATEST" = "0.0.0" ]; then
            CHANGELOG=$(git log --pretty=format:'- %s (%h)' -n 50)
          else
            CHANGELOG=$(git log --pretty=format:'- %s (%h)' $LATEST..HEAD)
          fi
          if [ -z "$CHANGELOG" ]; then
            CHANGELOG="No notable changes"
          fi
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Sync version metadata
        env:
          RELEASE_VERSION: ${{ steps.semver.outputs.tag }}
        run: |
          cd frontend
          npm version --no-git-tag-version "$RELEASE_VERSION"
          cd ..
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          release_version = os.environ["RELEASE_VERSION"]
          pyproject_path = Path("backend/pyproject.toml")
          pyproject_text = pyproject_path.read_text()
          updated_text, replacements = re.subn(
              r'(?m)^version = ".*"$',
              f'version = "{release_version}"',
              pyproject_text,
              count=1,
          )
          if replacements != 1:
              raise SystemExit("Expected to update exactly one backend version field")
          pyproject_path.write_text(updated_text)
          PY

      - name: Commit synced versions
        id: commit_versions
        env:
          RELEASE_VERSION: ${{ steps.semver.outputs.tag }}
        run: |
          if git diff --quiet -- frontend/package.json frontend/package-lock.json backend/pyproject.toml; then
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package.json frontend/package-lock.json backend/pyproject.toml
          git commit -m "chore: sync app versions to ${RELEASE_VERSION}"

          MAX_RETRIES=3
          for i in $(seq 1 $MAX_RETRIES); do
            if git push origin HEAD:main; then
              break
            fi
            if [ "$i" -eq "$MAX_RETRIES" ]; then
              echo "Push failed after $MAX_RETRIES attempts"
              exit 1
            fi
            git fetch origin main
            git rebase origin/main
          done
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Create or update GitHub release
        run: |
          TAG="${{ steps.semver.outputs.tag }}"
          NOTES="${{ steps.changelog.outputs.changelog }}"
          RELEASE_SHA="${{ steps.commit_versions.outputs.sha }}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TAG" --notes "$NOTES"
          else
            gh release create "$TAG" --title "$TAG" --notes "$NOTES" --target "$RELEASE_SHA"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  build-and-push:
    needs: create-release
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/docker-build-and-push.yml
    with:
      git_ref: ${{ needs.create-release.outputs.release_sha }}
      version_tag: ${{ needs.create-release.outputs.tag }}
      push_latest: true
