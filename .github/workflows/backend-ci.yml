name: Backend CI

on:
  push:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: stockwire_rental
          POSTGRES_USER: stockwire_rental
          POSTGRES_PASSWORD: stockwire_rental
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U stockwire_rental -d stockwire_rental"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Run tests
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: '5432'
          POSTGRES_DB: stockwire_rental
          POSTGRES_USER: stockwire_rental
          POSTGRES_PASSWORD: stockwire_rental
        run: pytest

      - name: Alembic migration check
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: '5432'
          POSTGRES_DB: stockwire_rental
          POSTGRES_USER: stockwire_rental
          POSTGRES_PASSWORD: stockwire_rental
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
