global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'backend'
    static_configs:
      - targets: ['backend:8000']
    metrics_path: /metrics
    basic_auth:
      username: prometheus
      password: metrics

  - job_name: 'nginx'
    static_configs:
      - targets: ['frontend:9000']
    metrics_path: /metrics
    basic_auth:
      username: prometheus
      password: metrics
