services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-stockwire_rental}
      POSTGRES_USER: ${POSTGRES_USER:-stockwire_rental}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stockwire_rental}
    ports:
      - "5432:5432"
    volumes:
      - stockwire-rental-postgres18-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-stockwire_rental} -d ${POSTGRES_DB:-stockwire_rental}"]
      interval: 10s
      timeout: 5s
      retries: 8

  valkey:
    image: valkey/valkey:9-alpine
    ports:
      - "${VALKEY_HOST_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli ping || redis-cli ping"]
      interval: 10s
      timeout: 5s
      retries: 8

  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    environment:
      APP_NAME: ${APP_NAME:-Stockwire Rental API}
      APP_ENV: ${APP_ENV:-development}
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-stockwire_rental}
      POSTGRES_USER: ${POSTGRES_USER:-stockwire_rental}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stockwire_rental}
      REDIS_URL: redis://valkey:6379/0
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:9000,http://localhost:3000}
      PROMETHEUS_ENABLED: true
      PROMETHEUS_METRICS_USER: ${PROMETHEUS_METRICS_USER:-prometheus}
      PROMETHEUS_METRICS_PASSWORD: ${PROMETHEUS_METRICS_PASSWORD:-metrics}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy

  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
      target: production
    environment:
      API_BASE_URL: ${API_BASE_URL:-}
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    ports:
      - "9000:9000"
    depends_on:
      - backend

  prometheus:
    image: prom/prometheus:v3.12.0
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--web.config.file=/etc/prometheus/web.yml'
      - '--storage.tsdb.path=/prometheus'
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus-web.yml:/etc/prometheus/web.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      - backend
      - frontend

  grafana:
    image: grafana/grafana:11.6.15
    environment:
      GF_INSTALL_PLUGINS: ""
      GF_AUTH_ANONYMOUS_ENABLED: "true"
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/dashboards/dashboard.yml:/etc/grafana/provisioning/dashboards/dashboard.yml:ro
      - ./grafana/dashboards/stockwire-metrics.json:/etc/grafana/provisioning/dashboards/definitions/stockwire-metrics.json:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  stockwire-rental-postgres18-data:
  prometheus-data:
  grafana-data:
