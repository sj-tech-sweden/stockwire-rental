services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-stockwire_rental}
      POSTGRES_USER: ${POSTGRES_USER:-stockwire_rental}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stockwire_rental}
    # ports:
    #   - "5432:5432"
    volumes:
      - stockwire-rental-postgres18-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-stockwire_rental} -d ${POSTGRES_DB:-stockwire_rental}"]
      interval: 10s
      timeout: 5s
      retries: 8

  valkey:
    image: valkey/valkey:9-alpine
    # ports:
    #   - "${VALKEY_HOST_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli ping || redis-cli ping"]
      interval: 10s
      timeout: 5s
      retries: 8

  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    environment:
      APP_NAME: ${APP_NAME:-Stockwire Rental API}
      APP_ENV: ${APP_ENV:-development}
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-stockwire_rental}
      POSTGRES_USER: ${POSTGRES_USER:-stockwire_rental}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stockwire_rental}
      REDIS_URL: redis://valkey:6379/0
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:9000,http://localhost:3000}
    ports:
      - "8000:8000"
    volumes:
      - ../../backend:/app:delegated
    command: sh -c "alembic upgrade head || true && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy

  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
      CHOKIDAR_USEPOLLING: 'true'
    ports:
      - "9000:9000"
    volumes:
      - ../../frontend:/app:delegated
      - /app/node_modules
    command: sh -c "npm install --no-audit --no-fund && npm run dev -- --host 0.0.0.0 --port 9000"
    depends_on:
      - backend

volumes:
  stockwire-rental-postgres18-data:
